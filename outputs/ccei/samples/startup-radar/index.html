<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>창업 지원사업 레이더</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 헤더: 서비스 이름 + 화면 이동 + 데이터 출처 -->
  <header class="header">
    <div class="inner header-inner">
      <div class="brand">
        <span class="radar-dot" aria-hidden="true"></span>
        <h1>창업 지원사업 레이더</h1>
        <span class="source" id="source">가상 데이터</span>
      </div>
      <nav class="tabs" aria-label="화면 이동">
        <button class="tab is-on" data-view="radar" type="button">레이더</button>
        <button class="tab" data-view="brief" type="button">주간 브리핑</button>
      </nav>
    </div>
  </header>

  <main class="inner">
    <!-- 화면 1: 레이더 (관심 키워드 + 맞는 공고 알림) -->
    <section id="view-radar" class="view">
      <div class="summary" id="summary"></div>

      <div class="radar-grid">
        <aside class="panel">
          <h2>관심 키워드</h2>
          <form id="kw-form" class="kw-form">
            <input id="kw-input" type="text" placeholder="예: AI, 제조, 청년" aria-label="관심 키워드 추가">
            <button type="submit">추가</button>
          </form>
          <div id="kw-list" class="chips"></div>

          <h2>조건</h2>
          <label>지원 분야<select id="f-field"><option value="">전체</option></select></label>
          <label>지역<select id="f-region"><option value="">전체</option></select></label>
          <label>창업 단계<select id="f-stage"><option value="">전체</option></select></label>
          <label class="check"><input type="checkbox" id="f-open" checked> 접수 중인 공고만</label>
        </aside>

        <div>
          <div class="feed-head">
            <p><b id="count">0</b>건이 관심 키워드에 걸렸습니다</p>
            <select id="sort" aria-label="정렬">
              <option value="due">마감 임박 순</option>
              <option value="match">키워드 많이 맞는 순</option>
              <option value="new">새로 열린 순</option>
            </select>
          </div>
          <ul id="feed" class="feed"></ul>
        </div>
      </div>
    </section>

    <!-- 화면 2: 공고 상세 (맞는 입주기업 + 안내 문구) -->
    <section id="view-detail" class="view" hidden>
      <button class="back" type="button" id="back">← 레이더로</button>
      <div id="detail"></div>
    </section>

    <!-- 화면 3: 주간 브리핑 (인쇄·파일로 넘기기) -->
    <section id="view-brief" class="view" hidden>
      <div class="brief-head">
        <div>
          <h2 id="brief-title">주간 지원사업 브리핑</h2>
          <p class="muted">관심 키워드에 걸린 공고를 마감 순으로 모으고, 입주기업별 추천을 붙였습니다.</p>
        </div>
        <div class="actions">
          <button type="button" id="print">인쇄하기</button>
          <button type="button" id="export">JSON으로 내보내기</button>
          <label class="file-btn">JSON 불러오기<input type="file" id="import" accept="application/json"></label>
        </div>
      </div>
      <div id="brief"></div>
    </section>
  </main>

  <footer class="footer">가상 공고·가상 입주기업으로 만든 연습용 화면입니다. 실제 신청은 각 기관 공고문을 확인합니다.</footer>

  <script src="data/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
