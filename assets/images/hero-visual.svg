<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="AI 어시스턴트가 반응형 웹사이트를 생성하고 있는 브라우저 화면">
  <defs>
    <linearGradient id="hvBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D6E96"/>
      <stop offset=".52" stop-color="#1C8DC0"/>
      <stop offset="1" stop-color="#5BBDE0"/>
    </linearGradient>
    <linearGradient id="hvBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D6E96"/>
      <stop offset="1" stop-color="#3A9EC8"/>
    </linearGradient>
    <linearGradient id="hvScan" x1="284" y1="0" x2="672" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A9EC8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#5BBDE0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#3A9EC8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hvGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3A9EC8" stop-opacity=".20"/>
      <stop offset="1" stop-color="#3A9EC8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hvSheen" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="hvShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#0A1422" flood-opacity=".16"/>
    </filter>
    <filter id="hvSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="hvHeroClip"><rect x="284" y="126" width="388" height="118" rx="12"/></clipPath>
  </defs>

  <!-- 배경 광원 -->
  <ellipse cx="430" cy="250" rx="340" ry="250" fill="url(#hvGlow)"/>

  <!-- 브라우저 카드 -->
  <g filter="url(#hvShadow)"><rect x="70" y="52" width="624" height="396" rx="24" fill="#FFFFFF"/></g>
  <rect x="70.5" y="52.5" width="623" height="395" rx="23.5" fill="none" stroke="#E3EAF1"/>

  <!-- 타이틀 바 -->
  <path d="M70 76a24 24 0 0 1 24-24h576a24 24 0 0 1 24 24v28H70z" fill="#F7FAFC"/>
  <line x1="70" y1="104" x2="694" y2="104" stroke="#E7EEF4"/>
  <g fill="#D6E2E8"><circle cx="98" cy="78" r="4.5"/><circle cx="114" cy="78" r="4.5"/><circle cx="130" cy="78" r="4.5"/></g>
  <rect x="152" y="66" width="392" height="24" rx="12" fill="#FFFFFF" stroke="#E3EAF1"/>
  <text x="166" y="82" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="500" fill="#8FA2B1">www.jtocom.com</text>
  <path d="M660 70l-2.6 5.4-5.4 2.6 5.4 2.6L660 86l2.6-5.4 5.4-2.6-5.4-2.6z" fill="#3A9EC8" opacity=".7"/>

  <!-- 좌측 AI 어시스턴트 레일 -->
  <path d="M70 104h192v320a24 24 0 0 1-24 24H94a24 24 0 0 1-24-24z" fill="#FAFCFD"/>
  <line x1="262" y1="104" x2="262" y2="448" stroke="#EDF2F6"/>

  <!-- 프롬프트 -->
  <rect x="90" y="188" width="152" height="74" rx="12" fill="#FFFFFF" stroke="#E7EEF4"/>
  <circle cx="106" cy="206" r="7" fill="#DDF0FA"/>
  <path d="M106 202.2l.9 2.9 2.9.9-2.9.9-.9 2.9-.9-2.9-2.9-.9 2.9-.9z" fill="#217DA0"/>
  <text x="120" y="209" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="9" font-weight="800" letter-spacing="1.1" fill="#93A6B5">PROMPT</text>
  <g fill="#E9EFF4"><rect x="104" y="222" width="124" height="7" rx="3.5"/><rect x="104" y="234" width="104" height="7" rx="3.5"/><rect x="104" y="246" width="66" height="7" rx="3.5"/></g>

  <!-- 생성 버튼 -->
  <rect x="90" y="278" width="152" height="34" rx="10" fill="url(#hvBtn)"/>
  <path d="M119 288.5l-2.3 4.8-4.8 2.3 4.8 2.3 2.3 4.8 2.3-4.8 4.8-2.3-4.8-2.3z" fill="#FFFFFF"/>
  <text x="134" y="299.5" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="800" letter-spacing=".4" fill="#FFFFFF">Generate</text>

  <!-- 진행 단계 -->
  <g>
    <circle cx="99" cy="338" r="7.5" fill="url(#hvBtn)"/>
    <path d="M95.7 338l2.2 2.2 4.4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="334" width="104" height="7" rx="3.5" fill="#E4EBF1"/>
    <circle cx="99" cy="364" r="7.5" fill="url(#hvBtn)"/>
    <path d="M95.7 364l2.2 2.2 4.4-4.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="360" width="88" height="7" rx="3.5" fill="#E4EBF1"/>
    <circle cx="99" cy="390" r="7.5" fill="#FFFFFF" stroke="#3A9EC8" stroke-width="2"/>
    <circle cx="99" cy="390" r="2.6" fill="#3A9EC8"/>
    <rect x="114" y="386" width="70" height="7" rx="3.5" fill="#EDF2F6"/>
  </g>

  <!-- 생성 중인 페이지 캔버스 -->
  <rect x="284" y="126" width="388" height="118" rx="12" fill="url(#hvBrand)"/>
  <g clip-path="url(#hvHeroClip)">
    <ellipse cx="590" cy="140" rx="150" ry="105" fill="url(#hvSheen)"/>
    <ellipse cx="320" cy="240" rx="130" ry="90" fill="#FFFFFF" opacity=".16"/>
  </g>
  <text x="478" y="192" text-anchor="middle" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="17" font-weight="800" letter-spacing="-.3" fill="#FFFFFF">Responsive Web</text>

  <!-- 생성 스캔 라인 -->
  <rect x="284" y="256" width="388" height="2.5" rx="1.25" fill="url(#hvScan)"/>
  <rect x="284" y="256" width="388" height="2.5" rx="1.25" fill="url(#hvScan)" filter="url(#hvSoft)" opacity=".8"/>

  <g fill="#E9EFF4"><rect x="284" y="274" width="272" height="8" rx="4"/><rect x="284" y="292" width="176" height="8" rx="4"/></g>
  <g fill="#F5F8FB" stroke="#EDF2F6">
    <rect x="284.5" y="318.5" width="120" height="58" rx="10"/>
    <rect x="417.5" y="318.5" width="120" height="58" rx="10"/>
    <rect x="550.5" y="318.5" width="120" height="58" rx="10"/>
  </g>
  <g fill="#DFE8EF">
    <rect x="298" y="332" width="46" height="6" rx="3"/><rect x="298" y="344" width="72" height="6" rx="3"/>
    <rect x="431" y="332" width="46" height="6" rx="3"/><rect x="431" y="344" width="72" height="6" rx="3"/>
    <rect x="564" y="332" width="46" height="6" rx="3"/><rect x="564" y="344" width="72" height="6" rx="3"/>
  </g>

  <!-- 주변 스파클 -->
  <g fill="#3A9EC8">
    <path d="M726 148l-3.2 6.8-6.8 3.2 6.8 3.2 3.2 6.8 3.2-6.8 6.8-3.2-6.8-3.2z" opacity=".5"/>
    <path d="M36 246l-2.4 5.1-5.1 2.4 5.1 2.4 2.4 5.1 2.4-5.1 5.1-2.4-5.1-2.4z" opacity=".4"/>
    <path d="M712 400l-1.9 4-4 1.9 4 1.9 1.9 4 1.9-4 4-1.9-4-1.9z" opacity=".35"/>
    <circle cx="52" cy="120" r="3" opacity=".35"/>
    <circle cx="700" cy="252" r="2.6" opacity=".3"/>
  </g>
</svg>
