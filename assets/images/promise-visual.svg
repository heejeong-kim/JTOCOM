<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" role="img" aria-label="기획부터 배포까지 이어지는 AI 프로젝트 파이프라인 대시보드">
  <defs>
    <linearGradient id="pvBg" x1="0" y1="0" x2="760" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C8D8E8"/>
      <stop offset=".55" stop-color="#E9F1F8"/>
      <stop offset="1" stop-color="#C2D3E3"/>
    </linearGradient>
    <radialGradient id="pvGlowA" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pvGlowB" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3A9EC8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3A9EC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pvBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D6E96"/>
      <stop offset=".55" stop-color="#3A9EC8"/>
      <stop offset="1" stop-color="#6DBFE0"/>
    </linearGradient>
    <linearGradient id="pvTrack" x1="200" y1="0" x2="560" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D6E96"/>
      <stop offset="1" stop-color="#5BBDE0"/>
    </linearGradient>
    <linearGradient id="pvBar" x1="124" y1="0" x2="636" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D6E96"/>
      <stop offset="1" stop-color="#6DBFE0"/>
    </linearGradient>
    <linearGradient id="pvNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A192E"/>
      <stop offset="1" stop-color="#14294A"/>
    </linearGradient>
    <linearGradient id="pvCircuit" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A9EC8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4E7E9C" stop-opacity=".5"/>
      <stop offset="1" stop-color="#3A9EC8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="pvDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#7E9AAE" fill-opacity=".22"/>
    </pattern>
    <filter id="pvShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0A1422" flood-opacity=".18"/>
    </filter>
    <filter id="pvShadowSm" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0A1422" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="760" height="500" fill="url(#pvBg)"/>
  <rect width="760" height="500" fill="url(#pvDots)"/>
  <ellipse cx="560" cy="90" rx="300" ry="210" fill="url(#pvGlowA)"/>
  <ellipse cx="130" cy="430" rx="280" ry="220" fill="url(#pvGlowB)"/>

  <!-- circuit motif -->
  <g fill="none" stroke="url(#pvCircuit)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 64 H120 l26 -26 H300"/>
    <path d="M760 158 H640 l-24 24 H470"/>
    <path d="M-20 452 H150 l30 30 H360"/>
    <path d="M760 424 H620 l-26 -26 H430"/>
  </g>
  <g fill="#5C89A6" fill-opacity=".38">
    <circle cx="146" cy="38" r="3"/><circle cx="616" cy="182" r="3"/>
    <circle cx="180" cy="482" r="3"/><circle cx="594" cy="398" r="3"/>
  </g>

  <!-- main card -->
  <g filter="url(#pvShadow)">
    <rect x="88" y="98" width="584" height="300" rx="26" fill="#FFFFFF"/>
  </g>
  <rect x="88.5" y="98.5" width="583" height="299" rx="25.5" fill="none" stroke="#E7EDF3"/>

  <!-- card header -->
  <g>
    <circle cx="124" cy="126" r="5" fill="#E2E9F0"/>
    <circle cx="140" cy="126" r="5" fill="#E2E9F0"/>
    <circle cx="156" cy="126" r="5" fill="#E2E9F0"/>
    <text x="180" y="131" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.7" fill="#4A5E72">AI PROJECT PIPELINE</text>
    <g stroke="#FFFFFF" stroke-width="2.5">
      <circle cx="590" cy="126" r="12" fill="#8FA5B8"/>
      <circle cx="610" cy="126" r="12" fill="#5FA9CC"/>
      <circle cx="630" cy="126" r="12" fill="#0D6E96"/>
    </g>
  </g>
  <line x1="88" y1="154" x2="672" y2="154" stroke="#EEF2F6" stroke-width="1"/>

  <text x="124" y="187" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#93A6B5">DELIVERY FLOW</text>

  <!-- pipeline track -->
  <line x1="200" y1="244" x2="560" y2="244" stroke="#E6ECF2" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="244" x2="440" y2="244" stroke="url(#pvTrack)" stroke-width="5" stroke-linecap="round"/>

  <!-- completed nodes -->
  <g>
    <circle cx="200" cy="244" r="23" fill="url(#pvBlue)"/>
    <path d="M191 244l6.5 6.5L210 238" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="320" cy="244" r="23" fill="url(#pvBlue)"/>
    <path d="M311 244l6.5 6.5L330 238" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="440" cy="244" r="23" fill="url(#pvBlue)"/>
    <path d="M431 244l6.5 6.5L450 238" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- active node -->
  <g>
    <circle cx="560" cy="244" r="34" fill="#3A9EC8" fill-opacity=".10"/>
    <circle cx="560" cy="244" r="23" fill="#FFFFFF" stroke="#3A9EC8" stroke-width="3"/>
    <circle cx="560" cy="244" r="7" fill="#3A9EC8"/>
  </g>

  <!-- step labels -->
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" text-anchor="middle">
    <text x="200" y="290" font-size="15" font-weight="700" fill="#0E1F35">기획</text>
    <text x="320" y="290" font-size="15" font-weight="700" fill="#0E1F35">디자인</text>
    <text x="440" y="290" font-size="15" font-weight="700" fill="#0E1F35">개발</text>
    <text x="560" y="290" font-size="15" font-weight="700" fill="#0E1F35">배포</text>
    <text x="200" y="308" font-size="10" font-weight="700" letter-spacing="1.2" fill="#9DAFBD">PLAN</text>
    <text x="320" y="308" font-size="10" font-weight="700" letter-spacing="1.2" fill="#9DAFBD">DESIGN</text>
    <text x="440" y="308" font-size="10" font-weight="700" letter-spacing="1.2" fill="#9DAFBD">BUILD</text>
    <text x="560" y="308" font-size="10" font-weight="700" letter-spacing="1.2" fill="#217DA0">DEPLOY</text>
  </g>

  <!-- progress -->
  <text x="124" y="345" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#93A6B5">PROGRESS</text>
  <text x="636" y="346" text-anchor="end" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="14" font-weight="800" fill="#0E1F35">92%</text>
  <rect x="124" y="356" width="512" height="10" rx="5" fill="#EFF3F7"/>
  <rect x="124" y="356" width="471" height="10" rx="5" fill="url(#pvBar)"/>

  <!-- floating badge : navy -->
  <g filter="url(#pvShadowSm)">
    <rect x="484" y="46" width="196" height="64" rx="18" fill="url(#pvNavy)"/>
  </g>
  <rect x="500" y="64" width="28" height="28" rx="9" fill="#6DBFE0" fill-opacity=".18"/>
  <path d="M515.5 70l-6 10h5l-1.5 8 6-10h-5z" fill="#6DBFE0"/>
  <text x="540" y="79" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="12.5" font-weight="800" letter-spacing=".6" fill="#6DBFE0">60% FASTER</text>
  <text x="540" y="96" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="500" fill="#A3BDCE">기존 제작 대비</text>

  <!-- floating badge : white -->
  <g filter="url(#pvShadowSm)">
    <rect x="64" y="372" width="214" height="78" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="64.5" y="372.5" width="213" height="77" rx="19.5" fill="none" stroke="#E7EDF3"/>
  <circle cx="102" cy="411" r="20" fill="url(#pvBlue)"/>
  <path d="M93 411l6.5 6.5L112 405" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="136" y="406" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="14" font-weight="700" fill="#0E1F35">기획 → 배포</text>
  <text x="136" y="426" font-family="'Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif" font-size="11" font-weight="500" fill="#7A8FA0">평균 1주 완료</text>
</svg>
